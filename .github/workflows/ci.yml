name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded feature/PR runs are cancelled; every main commit is fully verified.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test-postgres:
    # The production database. Local development machines may not have it,
    # so this job is where the PostgreSQL code path is actually verified.
    # Only the database-backed suites run here: the node agent is Windows-only
    # (ctypes.WinDLL, Job Objects, PDH) and is covered by test-windows.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: udcs
          POSTGRES_PASSWORD: udcs-ci-only  # throwaway, CI-local container
          POSTGRES_DB: udcs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U udcs" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB_URL: postgresql+psycopg://udcs:udcs-ci-only@localhost:5432/udcs_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen

      - name: Alembic upgrade from a clean database (production CLI path)
        env:
          UDCS_DATABASE_URL: ${{ env.DB_URL }}
        run: |
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          engine = create_engine(os.environ["UDCS_DATABASE_URL"])
          tables = inspect(engine).get_table_names()
          assert engine.dialect.name == "postgresql", engine.dialect.name
          assert tables == [], f"database is not clean: {tables}"
          print("clean postgresql database confirmed")
          PY
          uv run udcs-controller migrate

      - name: Verify the database is at the Alembic head and matches the models
        env:
          UDCS_DATABASE_URL: ${{ env.DB_URL }}
        run: |
          uv run python - <<'PY'
          import os
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine
          from udcs_controller.database import registry  # noqa: F401 (loads all models)
          from udcs_controller.database.base import Base
          from udcs_controller.database.migrate import alembic_config

          engine = create_engine(os.environ["UDCS_DATABASE_URL"])
          heads = set(ScriptDirectory.from_config(alembic_config()).get_heads())
          with engine.connect() as conn:
              ctx = MigrationContext.configure(conn, opts={"compare_type": True})
              current = set(ctx.get_current_heads())
              diff = compare_metadata(ctx, Base.metadata)
          print("alembic heads:", sorted(heads), "database:", sorted(current))
          assert current == heads, "database is not at the migration head"
          assert not diff, f"migrations differ from models on PostgreSQL: {diff}"
          print("postgresql schema matches models at head")
          PY

      - name: Controller and shared tests on PostgreSQL
        env:
          UDCS_TEST_DATABASE_URL: ${{ env.DB_URL }}
          UDCS_REQUIRE_POSTGRES: "1"  # conftest fails instead of falling back to SQLite
        run: uv run pytest shared/tests controller/tests -v -rs

      - name: Scheduler race tests on PostgreSQL (repeated to expose races)
        env:
          UDCS_TEST_DATABASE_URL: ${{ env.DB_URL }}
          UDCS_REQUIRE_POSTGRES: "1"
          UDCS_RACE_ROUNDS: "50"  # independent sessions, released together by a barrier
        run: uv run pytest controller/tests/test_jobs_concurrency.py -q -rs

  test-windows:
    # Primary lab-machine platform: DPAPI, Job Objects, PDH, the governor and
    # the workload manager. Runs the whole suite on SQLite.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -rs
