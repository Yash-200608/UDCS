name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test-postgres:
    # The production database. Local development machines may not have it,
    # so this job is where the PostgreSQL code path is actually verified.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: udcs
          POSTGRES_PASSWORD: udcs-ci-only  # throwaway, CI-local container
          POSTGRES_DB: udcs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U udcs" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      UDCS_TEST_DATABASE_URL: postgresql+psycopg://udcs:udcs-ci-only@localhost:5432/udcs_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest

  test-windows:
    # Primary lab-machine platform: exercises DPAPI, registry CPU lookup, idle detection.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest
