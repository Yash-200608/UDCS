[project]
name = "udcs-workspace"
version = "0.1.0"
description = "UDCS — University Distributed Compute System (workspace root)"
requires-python = ">=3.11"
dependencies = ["udcs-shared", "udcs-controller", "udcs-agent"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "controller", "node_agent"]

[tool.uv.sources]
udcs-shared = { workspace = true }
udcs-controller = { workspace = true }
udcs-agent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
    "trustme>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "controller/tests", "node_agent/tests", "tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "hardware: reads the real hardware of the machine running the tests",
    "e2e: starts a real controller over TLS and a real agent",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"tests/**" = ["S105", "S106"]
"tools/**" = ["S603"]  # fixed argv, no shell

[tool.ruff.lint.isort]
known-first-party = ["udcs_shared", "udcs_controller", "udcs_agent"]
