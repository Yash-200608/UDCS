[project]
name = "udcs-controller"
version = "0.1.0"
description = "UDCS control plane: API, auth, node registry"
requires-python = ">=3.11"
dependencies = [
    "udcs-shared",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "argon2-cffi>=23.1,<26",
]

[project.scripts]
udcs-controller = "udcs_controller.cli:main"

[tool.uv.sources]
udcs-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
