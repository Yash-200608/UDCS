[project]
name = "udcs-agent"
version = "0.1.0"
description = "UDCS node agent: hardware discovery, telemetry, execution"
requires-python = ">=3.11"
dependencies = [
    "udcs-shared[http]",
    "httpx>=0.28,<1",
    "psutil>=6.1,<8",
    "nvidia-ml-py>=12.535,<14",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.scripts]
udcs-agent = "udcs_agent.cli:main"

[tool.uv.sources]
udcs-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
